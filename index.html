<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Accessible Modal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ------------------------------
       基本スタイル
    ------------------------------ */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      }

      body.modal-open {
        overflow: hidden;
      }

      /* ------------------------------
       ヘッダー（Figma: Frame 1）
    ------------------------------ */

      .site-header {
        display: flex;
        align-items: center;
        justify-content: center;

        width: 100%;
        padding: 14px 72px;

        background: #f5ffba;
      }

      .site-header__title {
        margin: 0;

        font-family: "IBM Plex Mono", monospace;
        font-weight: 600;
        font-size: 24px;
        line-height: normal;
        color: #000;
        text-align: center;
      }

      main {
        padding: 40px;
        min-height: 100vh;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      .open-button {
        padding: 10px 16px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
      }

      .open-button:focus-visible,
      .modal__close:focus-visible,
      .modal__button:focus-visible {
        outline: 3px solid #f59e0b;
        outline-offset: 3px;
      }

      /* ------------------------------
       モーダル
    ------------------------------ */

      .modal {
        position: fixed;
        inset: 0;

        display: grid;
        place-items: center;

        padding: 20px;

        background: rgb(0 0 0 / 60%);

        /*
       * 初期状態では非表示。
       * hidden を使うことでスクリーンリーダーからも
       * 基本的に不可視になる。
       */
        visibility: hidden;
        opacity: 0;

        transition:
          opacity 150ms ease,
          visibility 150ms ease;

        z-index: 1000;
      }

      .modal.is-open {
        visibility: visible;
        opacity: 1;
      }

      .modal__content {
        position: relative;

        width: min(100%, 560px);
        max-height: min(80vh, 700px);

        overflow: auto;

        padding: 32px;

        background: #fff;
        color: #111;

        border-radius: 12px;

        box-shadow: 0 20px 50px rgb(0 0 0 / 30%);
      }

      .modal__title {
        margin: 0 40px 16px 0;
        font-size: 1.5rem;
        line-height: 1.3;
      }

      .modal__description {
        margin: 0 0 24px;
      }

      .modal__close {
        position: absolute;
        top: 16px;
        right: 16px;

        width: 40px;
        height: 40px;

        border: 0;
        border-radius: 50%;

        background: transparent;
        color: #333;

        font-size: 1.5rem;
        line-height: 1;
      }

      .modal__close:hover {
        background: #eee;
      }

      .modal__actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
      }

      .modal__button {
        padding: 10px 16px;
        border: 1px solid #999;
        border-radius: 6px;
        background: #fff;
      }

      .modal__button--primary {
        border-color: #2563eb;
        background: red;
        color: #fff;
      }

      /* ------------------------------
       アニメーションを減らす設定
    ------------------------------ */

      @media (prefers-reduced-motion: reduce) {
        .modal {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <p class="site-header__title">Claude Code - Figma test</p>
    </header>

    <!--
    モーダルの外側。

    inert によってモーダル表示中は
    背景コンテンツをキーボード・マウス操作の対象外にする。
  -->
    <main id="page-content">
      <h1>ユーザー設定</h1>

      <p>これはモーダルの動作確認用ページです。</p>

      <button
        type="button"
        class="open-button"
        id="open-modal"
        aria-haspopup="dialog"
      >
        設定を開く
      </button>

      <p>
        モーダルが開いている間、このページの要素には Tab キーで移動できません。
      </p>
    </main>

    <!--
    role="dialog"
    aria-modal="true"

    これによって支援技術に
    「これはモーダルダイアログである」と伝える。
  -->
    <div
      class="modal"
      id="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      aria-describedby="modal-description"
      aria-hidden="true"
    >
      <!--
      モーダルの中身。

      tabindex="-1" により、
      通常フォーカスできない要素にも JS から
      focus() できるようにする。
    -->
      <div class="modal__content" id="modal-content" tabindex="-1">
        <button
          type="button"
          class="modal__close"
          id="close-modal"
          aria-label="閉じる"
        >
          <span aria-hidden="true">&times;</span>
        </button>

        <h2 class="modal__title" id="modal-title">ユーザー設定</h2>

        <p class="modal__description" id="modal-description">
          設定を変更しますか？
        </p>

        <div class="modal__actions">
          <button type="button" class="modal__button" id="cancel-modal">
            キャンセルする
          </button>

          <button
            type="button"
            class="modal__button modal__button--primary"
            id="confirm-modal"
          >
            設定する
          </button>
        </div>
      </div>
    </div>

    <script>
      /* モーダル　*/
      const modal = document.querySelector("#modal");
      const modalContent = document.querySelector("#modal-content");

      const openButton = document.querySelector("#open-modal");
      const closeButton = document.querySelector("#close-modal");
      const cancelButton = document.querySelector("#cancel-modal");
      const confirmButton = document.querySelector("#confirm-modal");

      const pageContent = document.querySelector("#page-content");

      // モーダル内でフォーカス可能な要素
      const focusableSelector = [
        "a[href]",
        "button:not([disabled])",
        "input:not([disabled])",
        "select:not([disabled])",
        "textarea:not([disabled])",
        "[tabindex]:not([tabindex='-1'])",
      ].join(",");

      /* モーダルを開く */
      function openModal() {
        // 閉じた後に戻すため、現在のフォーカスを記録
        openModal.previousActiveElement = document.activeElement;

        // 背景を操作不能にする
        pageContent.inert = true;

        // モーダルを表示
        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");

        // bodyのスクロールを停止
        document.body.classList.add("modal-open");

        /*　フォーカス可能な要素があれば最初の要素へ。今回は閉じるボタンが最初なので、ユーザーはまず「閉じる」にアクセスできる*/
        const focusableElements = modal.querySelectorAll(focusableSelector);
        if (focusableElements.length > 0) {
          focusableElements[0].focus();
        } else {
          modalContent.focus();
        }
      }

      /* モーダルを閉じる */

      function closeModal() {
        modal.classList.remove("is-open");
        modal.setAttribute("aria-hidden", "true");
        pageContent.inert = false;
        document.body.classList.remove("modal-open");

        /* モーダルを開いたボタンへフォーカスを戻す　アクセシビリティ上重要 */
        if (
          openModal.previousActiveElement &&
          document.contains(openModal.previousActiveElement)
        ) {
          openModal.previousActiveElement.focus();
        }
      }

      /**フォーカストラップ　Tab/Shift＋Tabでモーダルの外にフォーカスが逃げないようにする */
      function trapFocus(event) {
        if (event.key !== "Tab") {
          return;
        }

        const focusableElements = [
          ...modal.querySelectorAll(focusableSelector),
        ];

        if (focusableElements.length === 0) {
          event.preventDefault();
          modalContent.focus();
          return;
        }
        const firstElement = focusableElements[0];
        const lastElement = focusableElements[focusableElements.length - 1];
        /* * Tab * * 最後 → 最初 */
        if (!event.shiftKey && document.activeElement === lastElement) {
          event.preventDefault();
          firstElement.focus();
        }
        /* * Shift + Tab * * 最初 → 最後 */
        if (event.shiftKey && document.activeElement === firstElement) {
          event.preventDefault();
          lastElement.focus();
        }
      }

      /* * Esc で閉じる */ function handleKeydown(event) {
        if (!modal.classList.contains("is-open")) {
          return;
        }
        if (event.key === "Escape") {
          event.preventDefault();

          closeModal();
          return;
        }
        trapFocus(event);
      }

      /* * 背景部分をクリックしたら閉じる。 * * modal 自体がクリックされた場合だけ。 * modal__content のクリックでは閉じない。 */
      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          closeModal();
        }
      });

      /* * イベント登録 */
      openButton.addEventListener("click", openModal);
      closeButton.addEventListener("click", closeModal);
      cancelButton.addEventListener("click", closeModal);
      confirmButton.addEventListener("click", () => {
        // 実際の処理をここに書く

        console.log("設定しました");
        closeModal();
      });

      document.addEventListener("keydown", handleKeydown);
    </script>
  </body>
</html>
